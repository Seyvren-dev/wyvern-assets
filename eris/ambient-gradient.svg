      <animate attributeName="cy" values="130;80;130" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cy="355" r="230" fill="url(#g3)">
      <animate attributeName="cx" values="650;820;650" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;305;360" dur="17s" repeatCount="indefinite"/>
